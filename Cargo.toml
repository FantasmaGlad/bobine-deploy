# Espace de travail de Bobine Deploy : bibliothèque pure (core) et application (src-tauri).
[workspace]
resolver = "2"
members = ["crates/deploy-core", "crates/deploy-proto", "crates/deploy-engine", "crates/bobine-deploy"]

# Paquets publiés : sans symboles de débogage, optimisés pour la taille.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
