[package]
name = "bobine-deploy"
version = "0.0.1"
edition = "2021"
description = "Installer et maintenir Bobine sur les machines du réseau, en interface graphique ou en ligne de commande."
repository = "https://github.com/FantasmaGlad/bobine-deploy"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "bobine_deploy_lib"

[build-dependencies]
sha2 = "0.11"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
bobine-deploy-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
if-addrs = "0.15"
dns-lookup = "4"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
zeroize = "1"

# libssh2 a besoin d'OpenSSL : celui du système sous Linux, compilé avec l'application sous Windows et macOS,
# qui n'en fournissent pas d'utilisable.
[target.'cfg(target_os = "linux")'.dependencies]
ssh2 = "0.9"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
default = []
