[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error: unmaintained, pulled only by the GTK 3 bindings of Tauri; removed with the native rewrite.
    { id = "RUSTSEC-2024-0370", reason = "GTK 3 bindings of Tauri, removed with the native rewrite" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
