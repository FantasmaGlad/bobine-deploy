[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Signature RSA à temps non constant (aucune version corrigée) : seulement avec une clé RSA fournie par
    # l'utilisateur, face à la machine qu'il a choisie.
    { id = "RUSTSEC-2023-0071", reason = "RSA signing only with a user-supplied key, towards the chosen target" },
    # Analyse des polices de l'interface : aucune police externe n'est chargée.
    { id = "RUSTSEC-2026-0192", reason = "GUI font stack, no untrusted font is ever loaded" },
    # Macro de compilation du rendu Metal (wgpu sur macOS) : rien ne s'exécute dans le binaire.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro of the Metal backend, nothing runs in the binary" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
