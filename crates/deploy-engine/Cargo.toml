[package]
name = "bobine-deploy-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Moteur de Bobine Deploy : découverte réseau, SSH (russh), audit et installation de Bobine sur la cible."
repository = "https://github.com/FantasmaGlad/bobine-deploy"

[dependencies]
bobine-deploy-core = { path = "../deploy-core" }
bobine-deploy-proto = { path = "../deploy-proto" }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
dns-lookup = "4"
zeroize = "1"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
