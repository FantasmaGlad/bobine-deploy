name: CI

# Pull request: checks, then (unless only documentation changed) every package is built, installed and started.
# Push to main: checks only, the packages were proven on the pull request. Tag vX.Y.Z (equal to VERSION): everything,
# then a signed GitHub release.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      installer: ${{ steps.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            *:refs/tags/v*|workflow_dispatch:*) printf 'packages=true\ninstaller=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
            push:*) printf 'packages=false\ninstaller=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed=$(git diff --name-only "$BASE" HEAD)
          # Documentation, licence, modèles de tickets et manifestes winget ne changent aucun paquet.
          if grep -qvE '(\.md$|^LICENSE$|^docs/|^\.github/ISSUE_TEMPLATE/|^scripts/winget/|^\.github/workflows/winget\.yml$)' <<<"$changed"; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi
          # L'empreinte épinglée est vérifiée à chaque compilation ; la comparaison à la release signée de Bobine, qui
          # dépend du réseau, seulement quand l'un ou l'autre change (et à chaque tag, avant publication).
          if grep -qE '^(vendor/install\.sh|bobine-release\.toml)$' <<<"$changed"; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (fmt, clippy, tests, deny)
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # OpenSSH server for the SSH engine integration tests (a throwaway sshd started by the tests themselves).
      - name: System dependencies
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y openssh-server
      - name: Version consistency
        run: |
          version=$(cat VERSION)
          for manifest in crates/*/Cargo.toml; do
            grep -q "^version = \"$version\"" "$manifest" || { echo "::error::$manifest != VERSION $version"; exit 1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF#refs/tags/v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} != VERSION $version"; exit 1
          fi
      - name: Script tests
        run: python3 -m unittest discover -s scripts/winget -p 'test_*.py'
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Embedded install.sh matches the signed Bobine release
        if: needs.changes.outputs.installer == 'true'
        run: python3 scripts/sync-install-sh.py --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  packages:
    name: Packages (${{ matrix.label }})
    needs: [changes, checks]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux x64, deb: amd64, rpm: x86_64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64, deb: arm64, rpm: aarch64 }
          - { os: windows-latest, label: Windows x64 }
          - { os: windows-11-arm, label: Windows arm64 }
          - { os: macos-15-intel, label: macOS x64 }
          - { os: macos-latest, label: macOS arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bundle
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y rpm xvfb libxkbcommon-x11-0
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Packaging tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v makensis || [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
      - name: Build identifier
        shell: bash
        run: git rev-parse --short HEAD > COMMIT
      - name: Build packages
        shell: bash
        env:
          # Release only: the .rpm is OpenPGP-signed for DNF. Imported into a throwaway GNUPGHOME, removed at the end.
          RELEASE_GPG_PRIVATE_KEY: ${{ runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_GPG_PRIVATE_KEY || '' }}
          GNUPGHOME: ${{ runner.temp }}/signing
        run: |
          gpg_sign=()
          if [ -n "$RELEASE_GPG_PRIVATE_KEY" ]; then
            fingerprint=B77D96D72F84F36ACAA3F8729CBF497D829EE15A
            install -d -m 0700 "$GNUPGHOME"
            trap 'gpgconf --kill gpg-agent 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
            rpm --import keys/bobine-release-signing.asc
            gpg_sign=(--gpg-sign "$fingerprint")
          elif [ "$RUNNER_OS" = Linux ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::secret RELEASE_GPG_PRIVATE_KEY absent: a release requires signed .rpm packages"; exit 1
          fi
          python scripts/bundle.py --out dist "${gpg_sign[@]}"
      - name: Install and start (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS install -y ./dist/bobine-deploy_*_${{ matrix.deb }}.deb
          test -x /usr/bin/bobine-deploy
          test -f /usr/share/icons/hicolor/128x128/apps/bobine-deploy.png
          bobine-deploy --json version | grep -q '"version"'
          bdp --json version | grep -q '"version"'
          set +e; bobine-deploy install --host 203.0.113.10 --user test; rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "install without --yes: exit $rc, 2 expected" >&2; exit 1; }
          # Still alive after 10 s: timeout kills it (124); a crash at startup returns another code.
          set +e; xvfb-run -a timeout 10 bobine-deploy; rc=$?; set -e
          [ "$rc" -eq 124 ] || { echo "the application stopped at startup (exit $rc)" >&2; exit 1; }
          sudo apt-get $APT_OPTIONS remove -y bobine-deploy
          test ! -e /usr/bin/bobine-deploy
          test ! -e /usr/bin/bdp
      - name: Install the rpm (Fedora)
        if: runner.os == 'Linux'
        run: |
          . scripts/ci/container-images.sh
          rpm_file=$(basename "$(ls dist/bobine-deploy-*.${{ matrix.rpm }}.rpm)")
          docker run --rm -v "$PWD/dist:/pkg:ro" "$FEDORA_IMAGE" \
            bash -c 'dnf -y -q install "/pkg/$1" && test -x /usr/bin/bobine-deploy && bdp --json version && rpm -q bobine-deploy' -- "$rpm_file"
      - name: Install, start and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Bobine-Deploy-Setup-*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Bobine Deploy'
          $exe = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "executable missing from $dir" }
          $version = & $exe.FullName --json version | Out-String
          if ($version -notmatch '"version"') { throw "bobine-deploy --json version: unexpected output ($version)" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "the application stopped at startup (exit $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe.FullName) { throw "incomplete uninstall: $($exe.FullName)" }
      - name: Mount and start (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/Bobine-Deploy-*.dmg)
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/Bobine Deploy.app" "$RUNNER_TEMP/Bobine Deploy.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/Bobine Deploy.app"
          test -f "$RUNNER_TEMP/Bobine Deploy.app/Contents/Resources/icon.icns"
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RUNNER_TEMP/Bobine Deploy.app/Contents/Info.plist")
          "$RUNNER_TEMP/Bobine Deploy.app/Contents/MacOS/$binary" --json version | grep -q '"version"'
          "$RUNNER_TEMP/Bobine Deploy.app/Contents/MacOS/$binary" & pid=$!
          sleep 10
          kill -0 "$pid" || { echo "the application stopped at startup" >&2; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, packages]
    runs-on: ubuntu-24.04
    steps:
      # Paquets ignorés seulement quand le tri l'a décidé (documentation seule, ou poussée sur main).
      - run: |
          [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.checks.result }}" = success ] || exit 1
          case "${{ needs.changes.outputs.packages }}:${{ needs.packages.result }}" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: assets
      - name: Sign SHA256SUMS
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/signing
        run: |
          install -d -m 0700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/ci/sign-release-checksums.sh assets
      - name: Verify assets
        run: bash scripts/ci/verify-release-assets.sh assets "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/v$version.md" ]; then cp "docs/releases/v$version.md" "$notes"; else echo "Bobine Deploy $version" > "$notes"; fi
          gh release create "$GITHUB_REF_NAME" assets/* --title "Bobine Deploy $version" --notes-file "$notes" --verify-tag
